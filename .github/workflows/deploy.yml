name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 보안: 액션은 태그 대신 커밋 지문(SHA)으로 고정 — 남이 태그를 바꿔치기해도 우리 배포엔 영향 없음
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 게임 서버 (Cloudflare Workers + Durable Objects) — Secret CLOUDFLARE_API_TOKEN 이 있을 때만 배포
      - name: 게임 서버 배포 (Cloudflare)
        id: cf
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
      - name: Build (관리자 비밀번호는 저장소 Secret ADMIN_PW 에서만 읽음)
        env:
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          OUT_DIR: dist
          SERVER_URL: ${{ steps.cf.outputs.deployment-url || vars.SERVER_URL }}
        run: python3 build.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
